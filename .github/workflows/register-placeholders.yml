name: Register placeholders for released blogs

on:
  push:
    branches: [ main ]
    paths:
      - 'src/content/blog/**.md'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode: changed (default) or all'
        required: true
        default: 'changed'
        type: choice
        options:
          - changed
          - all
      inline:
        description: 'Inline placeholders per blog (default 3)'
        required: false
        default: '3'
        type: string
      changed_files:
        description: 'Changed blog files (optional). Newline or comma-separated list of src/content/blog/*.md to process when mode=changed.'
        required: false
        default: ''
        type: string

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Determine changed blog files (push events)
        if: github.event_name == 'push'
        id: changed
        run: |
          set -e
          BEFORE=${{ github.event.before }}
          AFTER=${{ github.event.after }}
          if [ -z "$BEFORE" ] || [ -z "$AFTER" ]; then
            BEFORE=$(git rev-parse HEAD^)
            AFTER=$(git rev-parse HEAD)
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" | grep '^src/content/blog/.*\.md$' || true)
          {
            echo 'changed<<EOF_CHANGED'
            printf '%s\n' "$CHANGED"
            echo 'EOF_CHANGED'
          } >> "$GITHUB_OUTPUT"

      - name: "Register placeholders (push: changed only)"
        if: github.event_name == 'push' && steps.changed.outputs.changed != ''
        env:
          CONVEX_URL: https://spotted-raven-102.convex.cloud
          CHANGED_FILES: ${{ steps.changed.outputs.changed }}
        run: |
          node scripts/register-released-blogs.js --changed="$CHANGED_FILES" --inline=3

      - name: "Register placeholders (manual: changed with provided list)"
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'changed' && inputs.changed_files != ''
        env:
          CONVEX_URL: https://spotted-raven-102.convex.cloud
        run: |
          LIST="${{ inputs.changed_files }}"
          # Normalize to comma-separated
          CHANGED=$(printf "%s" "$LIST" | tr '\n' ',' | sed 's/,,*/,/g' | sed 's/,\s*/,/g' | sed 's/,$//')
          echo "Changed files: $CHANGED"
          node scripts/register-released-blogs.js --changed="$CHANGED" --inline=${{ inputs.inline }}

      - name: "Register placeholders (manual: changed fallback to all)"
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'changed' && inputs.changed_files == ''
        env:
          CONVEX_URL: https://spotted-raven-102.convex.cloud
        run: |
          echo "Manual dispatch (changed): no changed_files provided; falling back to all released posts."
          node scripts/register-released-blogs.js --inline=${{ inputs.inline }}

      - name: "Register placeholders (manual: all)"
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'all'
        env:
          CONVEX_URL: https://spotted-raven-102.convex.cloud
        run: |
          node scripts/register-released-blogs.js --inline=${{ inputs.inline }}
