name: E2E Tests

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    env:
      NODE_ENV: production
      VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set +e
          node --version | tee npm-ci-output.log
          npm --version | tee -a npm-ci-output.log
          npm ci 2>&1 | tee -a npm-ci-output.log
          install_exit=${PIPESTATUS[0]}
          exit "$install_exit"

      - name: Run E2E tests
        shell: bash
        run: |
          set +e
          npm run test:e2e 2>&1 | tee e2e-output.log
          test_exit=${PIPESTATUS[0]}
          exit "$test_exit"

      - name: Upload Playwright failure output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-output
          path: |
            e2e-output.log
            npm-ci-output.log
            test-results/
            playwright-report/
          if-no-files-found: ignore

      - name: Summarize E2E failure
        if: failure()
        shell: bash
        run: |
          if [ -f e2e-output.log ]; then
            summary="$(tr '\n' ' ' < e2e-output.log | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' | cut -c 1-1800)"
            echo "::error title=E2E command output::$summary"
          fi
          if [ -f npm-ci-output.log ]; then
            summary="$(tr '\n' ' ' < npm-ci-output.log | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' | cut -c 1-1800)"
            echo "::error title=npm ci output::$summary"
          fi
          {
            echo '### E2E failure output'
            echo '```text'
            cat npm-ci-output.log || true
            cat e2e-output.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
