name: E2E Tests

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    env:
      NODE_ENV: production
      VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run E2E tests
        shell: bash
        run: |
          set +e
          npm run test:e2e 2>&1 | tee e2e-output.log
          test_exit=${PIPESTATUS[0]}
          exit "$test_exit"

      - name: Upload Playwright failure output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-output
          path: |
            e2e-output.log
            test-results/
            playwright-report/
          if-no-files-found: ignore

      - name: Summarize E2E failure
        if: failure()
        shell: bash
        run: |
          {
            echo '### E2E failure output'
            echo '```text'
            cat e2e-output.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
