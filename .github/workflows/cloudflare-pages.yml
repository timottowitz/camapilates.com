name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: 
      name: production
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: deno install

      # vite build transpiles without type checking, which is how a component that
      # called slugify() without importing it reached production and crashed every
      # blog listing page. Gate on src/ only: convex/ still has pre-existing errors
      # and is deployed by Convex's own tooling, not by this workflow.
      - name: Type-check src
        run: |
          deno run -A npm:typescript/tsc --noEmit > tsc.log 2>&1 || true
          if grep -q '^src/' tsc.log; then
            echo "::error::TypeScript errors in src/ — see below"
            grep '^src/' tsc.log
            exit 1
          fi
          echo "src/ is type-clean"

      - name: Build
        run: deno task build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}

      - name: Publish to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch is required: actions/checkout leaves a detached HEAD, so wrangler
          # cannot infer the branch and files the deploy as a preview, leaving
          # camadepilates.com on the previous build even though the job goes green.
          command: pages deploy ./dist --project-name=camadepilates --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
